<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0d0d0d;
            color: #fff;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 401px;
            background: #000;
            padding: 20px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
        }

        .sidebar img {
            width: 298px;
            border-radius: 50%;
            margin-top: 10px;
            margin-left: 33px;
            margin-bottom: 15px;
        }

        .sidebar h2 {
            font-size: 24px;
            color: #ffffff;
            font-weight: 600;
            text-align: center;
        }

        .sidebar p {
            font-size: 20px;
            font-weight: 300;
            text-align: center;
            color: #ff2424;
            margin-bottom: 20px;
        }

        .sidebar h3 {
            font-size: 16px;
            text-align: center;
            font-weight: 600;
        }

        .sidebar ol li {
            margin: 8px 0;
            cursor: pointer;
            margin-left: 20px;
            color: #ccc;
        }

        .sidebar ol li:hover {
            color: #d32f2f;
        }

        /* Main content */
        .main {
            margin-left: 401px;
            width: calc(100% - 401px);
        }

        /* Navbar */
        .navbar {
            display: flex;
            padding: 10px;
            background-color: #191d20;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .navbar input {
            width: 60%;
            background-color: #272A30;
            color: #aaafc0;
            padding: 10px;
            margin-left: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
        }

        .navbar .btns {
            padding: 10px 60px;
            border: none;
            margin-top: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            background: #d32f2f;
            color: white;
            cursor: pointer;
        }

        .navbar .btns:hover {
            background: #b71c1c;
        }

        .navbar .logo img {
            width: 50px;
            padding-left: 10px;
        }

        /* Banner */

        .banner img {
            width: 1100px;
            border-radius: 30px;
            margin-bottom: 25px;
            padding: 20px;
        }

        /* Menu Grid */
        h2 {
            margin-bottom: 15px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(29%, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            object-fit: cover;
            padding: 10px;
            margin-bottom: 10px;
        }

        .card-detail {
            display: flex;
            justify-content: space-between;
        }

        .card-left p {
            text-align: left;
        }

        .card-right button {
            width: 40px;
            height: 40px;
            color: #aaafc0;
            background-color: #363A43;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
            border-radius: 5px;
        }

        .order-btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #d32f2f;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .order-btn:hover {
            background: #b71c1c;
        }

        #status {
            margin-top: 20px;
            background: #222;
            padding: 55px;
            border-radius: 10px;
            color: #eee;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <img src="logo.png" alt="Logo" />
        <h2>Your Restaurant Menu</h2>
        <p>Your Slogan</p>

        <h3>Quick Links</h3>
        <ol>
            <li>Home</li>
            <li>Your Orders</li>
            <li>Wallet</li>
            <li>Profile</li>
            <li>Logout</li>
        </ol>

        <h3>More About Us</h3>
        <ol>
            <li>Our Blog</li>
            <li>Upcoming Dishes</li>
            <li>Our Story</li>
            <li>Social Media Links</li>
        </ol>
    </div>

    <!-- Main Content -->
    <div class="main">
        <div class="navbar">
            <input type="text" placeholder="Search Food Item" />
            <button class="btns">Signup</button>
            <button class="btns">Login</button>
            <div class="logo">
                <img src="logo.png" alt="logo" />
            </div>
        </div>

        <div class="banner"><img src="banner.png" alt=""></div>

        <h2>Menu</h2>
        <div id="menu" class="menu"></div>
        <div id="status"></div>
    </div>

    <script>
        // Fetch menu JSON and display items
        async function getMenu() {
            try {
                let res = await fetch("https://raw.githubusercontent.com/saksham-accio/f2_contest_3/main/food.json"); // Replace with your JSON URL
                let data = await res.json();
                displayMenu(data);
            } catch (err) {
                console.error("Error fetching menu:", err);
            }
        }

        function displayMenu(items) {
            let menuDiv = document.getElementById("menu");
            menuDiv.innerHTML = "";
            items.forEach(food => {
                let card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
              <img class="card-img" src="${food.imgSrc}" alt="${food.name}"/>
                <div class="card-detail">
               <div class="card-left">
                  <h4>${food.name}</h4>
                  <p>₹${food.price}/-</p>  
                </div>
                <div class="card-right">
                  <button>+</button>
                </div>
                </div>`;
                menuDiv.appendChild(card);
            });
            startOrder();
        }

        // Promise functions
        function TakeOrder() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const sample = ["Cheeseburger", "Pizza", "Tacos", "Sushi", "Pasta"];
                    let order = [];
                    for (let i = 0; i < 3; i++) {
                        order.push(sample[Math.floor(Math.random() * sample.length)]);
                    }
                    resolve({ order });
                }, 2500);
            });
        }

        function orderPrep() {
            return new Promise((resolve) => {
                setTimeout(() => resolve({ order_status: true, paid: false }), 1500);
            });
        }

        function payOrder() {
            return new Promise((resolve) => {
                setTimeout(() => resolve({ order_status: true, paid: true }), 1000);
            });
        }

        function thankyouFnc() {
            alert("Thank you for eating with us today!");
        }

        // Run order sequence
        async function startOrder() {
            let statusDiv = document.getElementById("status");
            statusDiv.innerHTML = "Taking your order...";

            try {
                let order = await TakeOrder();
                statusDiv.innerHTML = "Order placed: " + order.order.join(", ");

                let prep = await orderPrep();
                statusDiv.innerHTML += "<br> Order prepared: " + JSON.stringify(prep);

                let payment = await payOrder();
                statusDiv.innerHTML += "<br> Payment status: " + JSON.stringify(payment);

                if (payment.paid) thankyouFnc();
            } catch (err) {
                statusDiv.innerHTML = "Error: " + err;
            }
        }

        window.onload = getMenu;
    </script>
</body>

</html>
